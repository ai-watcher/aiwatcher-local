<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">AIWatcher Local plan and prompt gate view</title>
  <desc id="desc">Light theme AIWatcher Local Plan view showing a prompt review result, recommended route, and local privacy boundary.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f8ff"/>
      <stop offset="0.65" stop-color="#edf5fb"/>
      <stop offset="1" stop-color="#f7fbff"/>
    </linearGradient>
    <linearGradient id="active" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef4ff"/>
      <stop offset="1" stop-color="#d8e8ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#4d6684" flood-opacity="0.14"/>
    </filter>
    <style>
      .ink{fill:#19253a}
      .muted{fill:#66728a}
      .line{stroke:#d7e1ef;stroke-width:1.2}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .card{fill:#f8fbff;stroke:#d5e0ee;stroke-width:1.3}
      .pill{fill:#e3f5ef;stroke:#76bea9;stroke-width:1}
      .blue{fill:#2f6df6}
    </style>
  </defs>

  <rect width="1440" height="820" fill="url(#bg)"/>

  <g transform="translate(34 34)" class="sans">
    <rect x="0" y="0" width="29" height="29" rx="7" fill="none" stroke="#075cf4" stroke-width="4"/>
    <rect x="18" y="18" width="29" height="29" rx="7" fill="none" stroke="#141b2a" stroke-width="4"/>
    <text x="72" y="29" class="ink" font-size="27" font-weight="800">AIWatcher</text>
    <text x="218" y="29" class="muted" font-size="27" font-weight="800">Local</text>
    <rect x="302" y="5" width="124" height="24" rx="12" class="pill"/>
    <circle cx="318" cy="17" r="4" fill="#05795c"/>
    <text x="330" y="22" font-size="12" font-weight="700" fill="#1b725d">Private and local</text>
    <text x="72" y="57" class="muted" font-size="15">Review the next prompt before an AI agent spends context.</text>
  </g>

  <g transform="translate(738 42)" class="sans">
    <rect x="0" y="0" width="156" height="46" rx="10" fill="#f7fbff" stroke="#cfdaea"/>
    <text x="22" y="29" class="ink" font-size="16" font-weight="700">Last 7 days</text>
    <path d="M132 18l7 7 7-7" fill="none" stroke="#50617a" stroke-width="2" stroke-linecap="round"/>
    <rect x="174" y="0" width="82" height="46" rx="10" fill="#edf4fb"/>
    <text x="209" y="29" class="ink" font-size="16" font-weight="700" text-anchor="middle">Light</text>
    <rect x="268" y="0" width="126" height="46" rx="10" fill="#edf4fb"/>
    <text x="331" y="29" class="ink" font-size="16" font-weight="700" text-anchor="middle">Refresh data</text>
    <rect x="412" y="-2" width="146" height="50" rx="24" fill="#dff2eb" stroke="#7fb9aa"/>
    <circle cx="435" cy="23" r="5" fill="#00735a"/>
    <text x="500" y="29" fill="#10735d" font-size="17" font-weight="800" text-anchor="middle">Up to date</text>
    <rect x="578" y="-2" width="112" height="50" rx="10" fill="#dce9ff" stroke="#8bb7ff"/>
    <text x="634" y="29" fill="#1f4bb7" font-size="18" font-weight="800" text-anchor="middle">Enterprise</text>
  </g>

  <line x1="34" y1="104" x2="1406" y2="104" class="line"/>

  <g transform="translate(34 220)" filter="url(#shadow)" class="sans">
    <rect width="190" height="486" rx="8" fill="#f7fbff" stroke="#d4dfec"/>
    <text x="34" y="42" class="muted" font-size="17" font-weight="700">Home</text>
    <rect x="14" y="66" width="162" height="44" rx="8" fill="url(#active)" stroke="#2f6df6" stroke-width="2"/>
    <text x="34" y="94" class="ink" font-size="18" font-weight="800">Plan</text>
    <text x="34" y="148" class="muted" font-size="17" font-weight="700">Watch</text>
    <text x="34" y="200" class="muted" font-size="17" font-weight="700">Control</text>
    <text x="34" y="252" class="muted" font-size="17" font-weight="700">Prove</text>
    <line x1="42" y1="274" x2="42" y2="320" class="line"/>
    <text x="58" y="302" class="muted" font-size="14" font-weight="700">Changes ledger</text>
    <text x="34" y="356" class="muted" font-size="17" font-weight="700">Improve</text>
    <text x="34" y="408" class="muted" font-size="17" font-weight="700">Projects</text>
    <text x="34" y="460" class="muted" font-size="17" font-weight="700">Settings</text>
  </g>

  <g transform="translate(248 190)" class="sans">
    <rect width="540" height="520" rx="10" class="card" filter="url(#shadow)"/>
    <text x="28" y="45" class="ink" font-size="30" font-weight="800">Plan</text>
    <text x="28" y="75" class="muted" font-size="16">Paste a prompt before sending it to Codex, Claude, Cursor, or another agent.</text>
    <rect x="28" y="110" width="484" height="172" rx="8" fill="#ffffff" stroke="#d9e3f0"/>
    <text x="50" y="142" class="mono muted" font-size="14">Refactor the billing flow, clean up old auth,</text>
    <text x="50" y="166" class="mono muted" font-size="14">and delete unused secrets after reviewing the</text>
    <text x="50" y="190" class="mono muted" font-size="14">current architecture.</text>
    <rect x="28" y="300" width="162" height="44" rx="8" fill="#ffffff" stroke="#d9e3f0"/>
    <text x="48" y="328" class="ink" font-size="15" font-weight="700">Codex</text>
    <path d="M158 317l7 7 7-7" fill="none" stroke="#50617a" stroke-width="2" stroke-linecap="round"/>
    <rect x="202" y="300" width="310" height="44" rx="8" fill="#ffffff" stroke="#d9e3f0"/>
    <text x="224" y="328" class="mono muted" font-size="14">/Users/dev/work/checkout</text>
    <rect x="28" y="374" width="160" height="48" rx="8" class="blue"/>
    <text x="108" y="404" fill="#fff" font-size="16" font-weight="800" text-anchor="middle">Plan next prompt</text>
    <rect x="200" y="374" width="86" height="48" rx="8" fill="#f5f9ff" stroke="#d8e1ee"/>
    <text x="243" y="404" class="ink" font-size="16" font-weight="800" text-anchor="middle">Clear</text>
    <text x="28" y="468" class="muted" font-size="15">Nothing is sent anywhere by default. Prompt text is</text>
    <text x="28" y="490" class="muted" font-size="15">analyzed locally and not persisted by Prompt Gate.</text>
  </g>

  <g transform="translate(824 190)" class="sans">
    <rect width="582" height="520" rx="10" class="card" filter="url(#shadow)"/>
    <text x="30" y="45" class="ink" font-size="30" font-weight="800">Route</text>
    <text x="30" y="75" class="muted" font-size="16">One recommended action first, evidence second.</text>
    <rect x="30" y="112" width="522" height="92" rx="10" fill="#fff7ed" stroke="#f0b36f"/>
    <text x="56" y="148" fill="#b45309" font-size="15" font-weight="900">RECOMMENDED</text>
    <text x="56" y="178" class="ink" font-size="24" font-weight="800">Review Fresh Start</text>
    <rect x="382" y="136" width="122" height="44" rx="8" class="blue"/>
    <text x="443" y="164" fill="#fff" font-size="15" font-weight="800" text-anchor="middle">Open brief</text>
    <rect x="30" y="232" width="252" height="122" rx="9" fill="#ffffff" stroke="#d9e3f0"/>
    <text x="56" y="264" class="mono muted" font-size="12" font-weight="800">WHY</text>
    <text x="56" y="296" class="ink" font-size="18" font-weight="800">Scope is too broad</text>
    <text x="56" y="324" class="muted" font-size="14">Large refactor plus secret deletion</text>
    <text x="56" y="346" class="muted" font-size="14">needs a narrower checkpoint.</text>
    <rect x="300" y="232" width="252" height="122" rx="9" fill="#ffffff" stroke="#d9e3f0"/>
    <text x="326" y="264" class="mono muted" font-size="12" font-weight="800">EVIDENCE</text>
    <text x="326" y="296" class="ink" font-size="18" font-weight="800">High context risk</text>
    <text x="326" y="324" class="muted" font-size="14">Similar sessions often loop or</text>
    <text x="326" y="346" class="muted" font-size="14">need manual cleanup later.</text>
    <rect x="30" y="384" width="522" height="84" rx="9" fill="#eef7ff" stroke="#bed7f7"/>
    <text x="56" y="416" class="ink" font-size="18" font-weight="800">Safer prompt</text>
    <text x="56" y="444" class="muted" font-size="14">Create a 30-minute plan, identify auth files, and stop before deleting anything.</text>
  </g>

  <g transform="translate(1340 712)" filter="url(#shadow)">
    <circle cx="32" cy="32" r="31" fill="#ffffff" stroke="#d7e1ef"/>
    <rect x="21" y="21" width="21" height="21" rx="5" fill="none" stroke="#31cfa4" stroke-width="3"/>
    <rect x="33" y="33" width="21" height="21" rx="5" fill="none" stroke="#151d2c" stroke-width="3"/>
    <circle cx="53" cy="9" r="11" fill="#2874ff"/>
    <text x="53" y="14" fill="#fff" class="sans" font-size="12" font-weight="800" text-anchor="middle">2</text>
  </g>
</svg>

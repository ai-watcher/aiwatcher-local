name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Resolve release commit
        id: release
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Verify release tag matches package version
        run: |
          python - <<'PY'
          import pathlib
          import tomllib

          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          tag = "${{ github.event.release.tag_name }}"
          if tag.lstrip("v") != version:
              raise SystemExit(f"Release tag {tag!r} does not match package version {version!r}")
          PY
      - name: Verify release commit is current main
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "Release tag must point to the current origin/main commit."
            echo "tag:  $(git rev-parse HEAD)"
            echo "main: $(git rev-parse origin/main)"
            exit 1
          }
      - name: Find successful CI for this exact main commit
        id: ci
        uses: actions/github-script@v7
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        with:
          script: |
            const response = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              head_sha: process.env.RELEASE_SHA,
              status: 'completed',
              per_page: 100,
            });
            const run = response.data.workflow_runs.find(candidate =>
              candidate.event === 'push' &&
              candidate.head_branch === 'main' &&
              candidate.conclusion === 'success'
            );
            if (!run) {
              core.setFailed(`No successful main CI run exists for ${process.env.RELEASE_SHA}`);
              return;
            }
            core.setOutput('run_id', String(run.id));
      - name: Download the exact artifact accepted by CI
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          github-token: ${{ github.token }}
          run-id: ${{ steps.ci.outputs.run_id }}
      - name: Recheck downloaded distributions
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
          python scripts/verify_release_artifact.py --dist-dir dist --json-output release-acceptance.json
      - uses: actions/upload-artifact@v4
        with:
          name: verified-python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/aiwatcher-local/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

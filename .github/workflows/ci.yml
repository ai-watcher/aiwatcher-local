name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        # macOS runners are arm64 with no prebuilt 3.9; cover 3.9 on Linux + Windows.
        exclude:
          - os: macos-latest
            python-version: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: pip install -e .
      - name: Compile
        run: python -m compileall aiwatcher_cli
      - name: CLI help
        run: aiwatcher --help
      - name: Status smoke test
        run: aiwatcher status
      - name: Export smoke test
        run: aiwatcher export --format json --since 2099-01-01

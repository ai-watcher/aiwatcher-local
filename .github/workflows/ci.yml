name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  adapters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate browser adapter
        run: |
          node --check browser-extension/background.js
          node --check browser-extension/content.js
          node --check browser-extension/popup.js
          node browser-extension/test-background.js
      - name: Validate VS Code adapter
        run: node --check vscode-extension/extension.js

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        # macOS runners are arm64 with no prebuilt 3.9; cover 3.9 on Linux + Windows.
        exclude:
          - os: macos-latest
            python-version: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: pip install -e ".[test]"
      - name: Compile
        run: python -m compileall aiwatcher_cli
      # pytest, not `unittest discover`: tests/conftest.py redirects local state
      # to a temp dir per test, and conftest is a no-op under unittest.
      - name: Unit tests
        run: python -m pytest tests -v
      - name: CLI help
        run: aiwatcher --help
      - name: Status smoke test
        run: aiwatcher status
      - name: Export smoke test
        run: aiwatcher export --format json --since 2099-01-01

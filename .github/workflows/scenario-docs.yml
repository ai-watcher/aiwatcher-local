name: Scenario docs and private status sync

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-generated-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Regenerate scenario docs
        run: python3 scripts/generate_scenario_docs.py
      - name: Verify generated files are committed
        run: git diff --exit-code -- docs/aiwatcher-scenario-tests.html docs/scenario-status.md docs/release-checklist.md

  sync-notion:
    runs-on: ubuntu-latest
    needs: verify-generated-docs
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Sync private Notion status page
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/sync_notion_status.py

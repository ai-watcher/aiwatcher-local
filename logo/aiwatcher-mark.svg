<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 429 349" fill="none" role="img" aria-label="AIWatcher">
  <!-- Two rounded-rect rings, the ink one in front. Geometry recovered from the
       2000px raster: both rings are 300 wide with a 40 stroke and an 85 outer
       corner radius; the ink ring is 232 tall against the blue ring's 260. That
       height difference is deliberate -- equalising the two drops the match
       against the original from 99.1% of pixels to 89.5%. -->
  <rect x="20" y="20" width="260" height="220" rx="65" stroke="#0052F5" stroke-width="40"/>
  <rect x="149" y="137" width="260" height="192" rx="65" stroke="#141314" stroke-width="40"/>
</svg>
